<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Porfolio — Interactivo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tu CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <main class="container py-5">
    <h1 class="text-center mb-4">Porfolio — Diseñadora Gráfica</h1>

    <section class="d-flex justify-content-center">
      <!-- Card central -->
      <div class="card shadow-lg interactive-portfolio" id="portfolio">
        <div class="card-body p-0 position-relative">
          <!-- Imagen central (elemento del medio) -->
          <button id="centerBtn" class="center-photo btn p-0 border-0" aria-expanded="false" aria-label="Abrir elementos del porfolio">
            <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder"
                 alt="Foto central - portafolio" class="d-block" />
            <div class="center-overlay">
              <div class="center-text">Mi trabajo</div>
            </div>
          </button>

          <!-- Elementos escondidos -->
          <div class="portfolio-item" data-angle="270" data-label="Branding" tabindex="0">
            <i data-lucide="palette"></i>
            <span class="item-label">Branding</span>
          </div>

          <div class="portfolio-item" data-angle="330" data-label="Ilustración" tabindex="0">
            <i data-lucide="pen-tool"></i>
            <span class="item-label">Ilustración</span>
          </div>

          <div class="portfolio-item" data-angle="30" data-label="Packaging" tabindex="0">
            <i data-lucide="box"></i>
            <span class="item-label">Packaging</span>
          </div>

          <div class="portfolio-item" data-angle="90" data-label="Editorial" tabindex="0">
            <i data-lucide="book-open"></i>
            <span class="item-label">Editorial</span>
          </div>

          <div class="portfolio-item" data-angle="150" data-label="Motion" tabindex="0">
            <i data-lucide="play"></i>
            <span class="item-label">Motion</span>
          </div>

          <div class="portfolio-item" data-angle="210" data-label="Web" tabindex="0">
            <i data-lucide="laptop"></i>
            <span class="item-label">Web</span>
          </div>

        </div> <!-- .card-body -->
      </div> <!-- .card -->
    </section>

    <p class="text-center mt-4 text-muted small">Haz click en la foto central para desplegar los elementos. Pulsa otra vez para esconderlos.</p>
  </main>

  <!-- GSAP (animaciones) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Tu JS -->
  <script src="js/script.js"></script>

  <!-- Inicializar Lucide -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
