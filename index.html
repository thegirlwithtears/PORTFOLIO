<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Diseñadora Gráfica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Sección Hero -->
    <header class="hero">
        <div class="container text-center">
            <h1 class="animated-text"></h1>
            <p>Creatividad. Diseño. Innovación.</p>
            <a href="#portfolio" class="btn btn-light mt-3">Ver Trabajos</a>
        </div>
    </header>

    <!-- Sección Galería -->
    <section id="portfolio" class="container my-5">
        <h2 class="text-center">Mi Trabajo</h2>
        <div class="row gallery">
            <div class="col-md-4"><img src="img1.jpg" class="img-fluid" alt="Diseño 1"></div>
            <div class="col-md-4"><img src="img2.jpg" class="img-fluid" alt="Diseño 2"></div>
            <div class="col-md-4"><img src="img3.jpg" class="img-fluid" alt="Diseño 3"></div>
        </div>
    </section>

    <!-- Sección Contacto -->
    <section id="contacto" class="contact-section text-center">
        <div class="container">
            <h2>Contacto</h2>
            <p>¡Hablemos sobre tu próximo proyecto!</p>
            <a href="mailto:correo@example.com" class="btn btn-light">Escríbeme</a>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
